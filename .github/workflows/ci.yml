name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.9.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build workspace first so cli can resolve types from @ctxo/plugin-api/dist.
      - name: Build workspace packages
        run: pnpm -r build

      - name: Lint
        run: pnpm -r lint
      - name: Typecheck
        run: pnpm -r typecheck

  unit-tests:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.9.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # plugin-api + lang-* export dist/index.js; tests resolve them via the
      # workspace link which requires the build output to exist.
      - name: Build workspace packages
        run: pnpm -r build

      - name: Run unit tests with coverage
        run: pnpm --filter @ctxo/cli test:unit:coverage

      - name: Run domain unit tests
        run: pnpm --filter @ctxo/domain test:unit

      # lang-csharp runs its `unit` vitest project here: the tree-sitter, mocked
      # Roslyn and packaging tests need no .NET. The `dotnet` project (Roslyn
      # integration tests) builds the helper and runs in the dotnet-tests job.
      - name: Run plugin-api, sql-extract and lang-sql tests, and the lang-csharp unit tests
        run: |
          pnpm --filter @ctxo/plugin-api --filter @ctxo/sql-extract --filter @ctxo/lang-sql test
          pnpm --filter @ctxo/lang-csharp test --project unit

      - name: Unit Test Report
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: always() && github.event_name != 'pull_request'
        with:
          name: Unit Test Results (Node ${{ matrix.node-version }})
          path: packages/cli/test-results/junit-unit.xml
          reporter: java-junit
          fail-on-error: true

      - name: Unit Test Report (PR)
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: always() && github.event_name == 'pull_request'
        with:
          name: Unit Test Results (Node ${{ matrix.node-version }})
          path: packages/cli/test-results/junit-unit.xml
          reporter: java-junit
          fail-on-error: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Coverage Summary
        if: always() && matrix.node-version == 22
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f packages/cli/coverage/coverage-summary.json ]; then
            node -e "
              const r = require('./packages/cli/coverage/coverage-summary.json').total;
              const fmt = (m) => \`\${m.pct}% (\${m.covered}/\${m.total})\`;
              const icon = (pct) => pct >= 90 ? '✅' : pct >= 70 ? '⚠️' : '❌';
              console.log('| Metric | Coverage | Status |');
              console.log('|--------|----------|--------|');
              for (const [key, val] of Object.entries(r)) {
                console.log(\`| \${key} | \${fmt(val)} | \${icon(val.pct)} |\`);
              }
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No coverage data found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Coverage PR Comment
        if: matrix.node-version == 22 && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: packages/cli/coverage/coverage-summary.json
          vite-config-path: packages/cli/vitest.config.unit.ts

      - name: Upload coverage artifact
        if: matrix.node-version == 22
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: packages/cli/coverage/
          retention-days: 14

  # The release gate (`pnpm -r test`) runs the lang-csharp `dotnet` project, so pull
  # requests run it too: the helper build and NuGet restore, the ScriptDom side of the
  # SQL conformance corpus, SQL call sites, annotations, the restore-failure fallback
  # and roll forward. It also runs the CLI's end-to-end C# to SQL test.
  dotnet-tests:
    name: .NET Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.9.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - run: pnpm install --frozen-lockfile

      # Build plugin-api + lang-* so cli can resolve their dist entries at runtime.
      - name: Build workspace packages
        run: pnpm -r build

      - name: Run the lang-csharp dotnet tests
        run: pnpm --filter @ctxo/lang-csharp test --project dotnet

      # The C# call site to SQL table chain needs the CLI core (blast radius, contexts
      # view), which a plugin must not import, so the test lives in the CLI e2e suite.
      # It is opt-in (CTXO_DOTNET_E2E=1), so the e2e-tests job skips it.
      - name: Run the end-to-end C# to SQL test
        env:
          CTXO_DOTNET_E2E: '1'
        run: pnpm --filter @ctxo/cli test:e2e tests/e2e/csharp-sql-call-site.test.ts

      # The domain acceptance suite on the Roslyn tier: with .NET set up, a C# run that falls back to the
      # syntax tier fails instead of skipping the cross-context edge tests.
      - name: Run the domain acceptance tests on the Roslyn tier
        env:
          CTXO_REQUIRE_DOTNET: '1'
        run: pnpm --filter @ctxo/domain test:e2e

  # The TypeScript, Java and Go plugins with their toolchains: the plugin suites on the
  # JDT and Go analyzer tiers, the analyzer's JUnit tests on both JDT profiles, the Go
  # analyzer's own tests, and the CLI's end-to-end language parity test.
  plugin-tests:
    name: Plugin Tests (TypeScript, Java, Go)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # A Java test reads a non-ASCII file name (Üye.java); the JVM needs a UTF-8 locale for it.
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.9.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/lang-go/tools/ctxo-go-analyzer/go.mod
          cache-dependency-path: packages/lang-go/tools/ctxo-go-analyzer/go.sum

      # The facts parity test runs C# on the Roslyn tier.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - run: pnpm install --frozen-lockfile

      # Also builds the JDT analyzer JARs (Maven) that the Java full tier runs.
      - name: Build workspace packages
        run: pnpm -r build

      - name: Run the lang-typescript, lang-java and lang-go tests
        env:
          CTXO_JDT_ANALYZER_JAR: ${{ github.workspace }}/packages/lang-java-analyzer/jar/ctxo-jdt-analyzer-17.jar
        # One package at a time: run together, the JVM and Go analyzers starve the ts-morph tests of CPU,
        # and their timing bounds (the fact-owner scale test) fail.
        run: pnpm --workspace-concurrency=1 --filter @ctxo/lang-typescript --filter @ctxo/lang-java --filter @ctxo/lang-go test

      - name: Run the JDT analyzer JUnit tests (Java 11 and Java 17 profiles)
        run: pnpm --filter @ctxo/lang-java-analyzer test && mvn -q -f packages/lang-java-analyzer/java/pom.xml -Pjava17 test

      - name: Run the Go analyzer tests
        working-directory: packages/lang-go/tools/ctxo-go-analyzer
        run: go test ./...

      # SQL call sites in TypeScript, Java and Go reach the lang-sql table, and the same
      # native facts come from TypeScript, C# (Roslyn), Java and Go.
      # Both are opt-in (CTXO_PARITY_E2E=1), so the e2e-tests job skips them.
      - name: Run the end-to-end language parity tests
        env:
          CTXO_PARITY_E2E: '1'
        run: pnpm --filter @ctxo/cli test:e2e tests/e2e/language-parity-sql.test.ts tests/e2e/facts-four-languages.test.ts

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint-typecheck]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.9.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: packages/cli/dist/
          retention-days: 1

      - name: Pack dry-run (all publishable packages)
        run: |
          echo "## Package Contents" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for pkg in @ctxo/plugin-api @ctxo/cli @ctxo/lang-typescript @ctxo/lang-go @ctxo/lang-csharp @ctxo/sql-extract @ctxo/lang-sql @ctxo/domain; do
            echo "### $pkg" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            pnpm --filter "$pkg" pack --dry-run 2>&1 | grep -E "^npm notice" | tee -a $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          done

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.9.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build plugin-api + lang-* so cli can resolve their dist entries at runtime.
      - name: Build workspace packages
        run: pnpm -r build

      - name: Run E2E tests
        run: pnpm --filter @ctxo/cli test:e2e

      - name: Run domain E2E tests
        run: pnpm --filter @ctxo/domain test:e2e

      - name: E2E Test Report
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: always() && github.event_name != 'pull_request'
        with:
          name: E2E Test Results
          path: packages/cli/test-results/junit-e2e.xml
          reporter: java-junit
          fail-on-error: true

      - name: E2E Test Report (PR)
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: always() && github.event_name == 'pull_request'
        with:
          name: E2E Test Results
          path: packages/cli/test-results/junit-e2e.xml
          reporter: java-junit
          fail-on-error: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: E2E Summary
        if: always()
        run: |
          echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f packages/cli/test-results/junit-e2e.xml ]; then
            TESTS=$(grep -o 'tests="[0-9]*"' packages/cli/test-results/junit-e2e.xml | head -1 | grep -o '[0-9]*')
            FAILURES=$(grep -o 'failures="[0-9]*"' packages/cli/test-results/junit-e2e.xml | head -1 | grep -o '[0-9]*')
            if [ "$FAILURES" = "0" ]; then
              echo "✅ All $TESTS E2E tests passed" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ $FAILURES/$TESTS E2E tests failed" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ No E2E test results found" >> $GITHUB_STEP_SUMMARY
          fi
